<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guía de operación CPS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: phone-first. A sticky header with the flow picker, then a "work order card" that animates between states,
   the step explanation, and a simulated inbox that fills as the flow advances. Two columns on desktop. */
:root{
  --bg:#f2f5f4; --card:#ffffff; --ink:#192828; --soft:#566868; --faint:#8a9a99; --line:#d6dedd;
  --accent:#0f6b66; --accent-cl:#dcefed;
  --red:#a8322d; --red-cl:#f8e3e1; --blue:#2a5a9e; --blue-cl:#e1ebf8; --green:#2e7a43; --green-cl:#e0f1e5;
  --amber:#8a5a00; --amber-cl:#f8ecd2; --violet:#5b3a8a; --violet-cl:#ece4f6;
  --f-disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111919; --card:#1a2424; --ink:#e6eeec; --soft:#a1b2b0; --faint:#71817f; --line:#2e3c3c;
  --accent:#4fbcb3; --accent-cl:#173634;
  --red:#ef8a83; --red-cl:#3a1f1d; --blue:#8db4ef; --blue-cl:#1c2a40; --green:#7fd398; --green-cl:#18311f;
  --amber:#e5b65b; --amber-cl:#352a12; --violet:#c3a5ef; --violet-cl:#2b2240; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.pad{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top));padding-bottom:10px}
.top-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.brand h1{font-size:20px;font-weight:800}
.brand span{font-size:12.5px;color:var(--soft)}
.flows{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.flows::-webkit-scrollbar{display:none}
.flow{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.flow[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}

main{max-width:1100px;margin:0 auto;padding-top:16px;padding-bottom:max(110px,calc(env(safe-area-inset-bottom) + 100px));display:flex;flex-direction:column;gap:16px}
.intro{display:flex;flex-direction:column;gap:4px}
.intro h2{font-size:clamp(22px,4.5vw,30px);font-weight:800}
.intro p{margin:0;color:var(--soft);max-width:65ch}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}

/* stepper */
.steps{display:flex;gap:4px}
.dot{flex:1;height:6px;border-radius:9px;background:var(--line);border:0;padding:0;cursor:pointer;transition:background .25s}
.dot.done{background:var(--accent)}
.dot.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-cl)}

/* object card */
.obj{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.obj-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.obj-id{font-family:var(--f-disp);font-weight:800;font-size:19px}
.obj-sub{font-size:13.5px;color:var(--soft)}
.trans{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px}
.st{display:inline-flex;align-items:center;font-weight:700;font-size:14px;border-radius:99px;padding:4px 12px;white-space:nowrap}
.st.old{opacity:.55;text-decoration:line-through}
.arrow{color:var(--faint);font-weight:700}
.st.new{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.t-g{background:var(--line);color:var(--ink)} .t-a{background:var(--amber-cl);color:var(--amber)} .t-m{background:var(--violet-cl);color:var(--violet)}
.t-v{background:var(--green-cl);color:var(--green)} .t-r{background:var(--red-cl);color:var(--red)} .t-b{background:var(--blue-cl);color:var(--blue)} .t-w{background:var(--amber-cl);color:var(--amber)}
.marks{display:flex;gap:6px;flex-wrap:wrap}
.mark{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--soft)}
.mark.on{border-color:var(--green);color:var(--green);font-weight:700}

/* step card */
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.step-top{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:0 0 auto;color:#fff}
.who b{display:block;font-size:15px}
.who span{font-size:12.5px;color:var(--soft)}
.step h3{font-size:21px;font-weight:700}
.step p{margin:0}
.btnsim{align-self:flex-start;border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--accent);color:var(--bg);cursor:pointer;box-shadow:0 2px 0 var(--accent-cl)}
.btnsim:active{transform:translateY(1px)}
.btnsim.pressed{animation:press .5s}
@keyframes press{50%{transform:scale(.94)}}
.why{background:var(--accent-cl);border-radius:12px;padding:10px 12px;font-size:14.5px}
.why b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.rule{background:var(--amber-cl);border-radius:12px;padding:10px 12px;font-size:14.5px}
.rule b{color:var(--amber)}

/* inbox */
.inbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.inbox-h{display:flex;justify-content:space-between;align-items:center}
.inbox-h h3{font-size:17px}
.cnt{font-size:12.5px;color:var(--soft)}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto}
.msg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.msg.fresh{animation:slide .45s ease;border-color:var(--accent)}
@keyframes slide{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.msg-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kind{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 8px;border-radius:99px}
.k-mail{background:var(--blue-cl);color:var(--blue)} .k-noti{background:var(--violet-cl);color:var(--violet)} .k-alert{background:var(--red-cl);color:var(--red)}
.to{font-size:12.5px;color:var(--soft)}
.msg b.sub{font-size:14.5px}
.msg .body{color:var(--soft)}
.empty{color:var(--faint);font-size:14px;text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:12px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-top:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.bar-in{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center}
.nb{border:1.5px solid var(--accent);background:var(--card);color:var(--accent);border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
.nb.p{background:var(--accent);color:var(--bg);flex:1}
.nb:disabled{opacity:.4;cursor:default}
.pos{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}

/* states map */
.map{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.map h3{font-size:19px}
.lane{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lane .arrow{font-size:14px}
.stb{cursor:pointer;border:2px solid transparent}
.stb[aria-pressed="true"]{border-color:currentColor}
.stinfo{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px;min-height:48px}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:700}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px}
.person b{display:block}
.person span{font-size:14px;color:var(--soft)}

@media (max-width:820px){ .grid{grid-template-columns:minmax(0,1fr)} .msgs{max-height:none} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<header class="top pad">
  <div class="top-in">
    <div class="brand"><h1>Guía de operación CPS</h1><a href="mapa.html" style="font-size:14px;font-weight:700;color:var(--accent);text-decoration:none">Ver el mapa completo ›</a></div>
    <nav class="flows" id="flows" aria-label="Recorridos"></nav>
  </div>
</header>

<main class="pad" id="main"></main>

<div class="bar pad" id="bar">
  <div class="bar-in">
    <button class="nb" id="prev" aria-label="Paso anterior">‹</button>
    <span class="pos" id="pos"></span>
    <button class="nb p" id="next">Siguiente paso ›</button>
    <button class="nb" id="play" aria-label="Reproducir solo">▶</button>
  </div>
</div>

<script>

/* WO lifecycle for the map (operación correcta) */
const ESTADOS=[
  ["Scheduled","g","Agendada. Todavía falta confirmar la fecha con el cliente.","Nace así al crear la WO."],
  ["Confirmed","a","El cliente confirmó la fecha.","Thalia, al registrar la fecha acordada."],
  ["Rescheduled","w","Se movió la fecha.","Thalia, al cambiar una fecha ya confirmada."],
  ["In progress","m","El técnico está trabajando.","El técnico, con «Ya llegué»."],
  ["Esperando aprobación","w","Hay un adicional esperando al cliente.","El técnico, con «Necesito aprobación»."],
  ["Detenido","w","Empezó pero algo externo lo frena.","Thalia, con «Detener trabajo»."],
  ["Pending","g","Esperando respuesta del cliente, con fecha límite.","Thalia, al avisar al cliente."],
  ["Completed","v","Terminada con fotos.","El técnico, con «Terminé»."],
  ["Returned","r","Con return: hay que corregir.","Gustavo o la oficina, al abrir un return."],
  ["Corrected","a","El return se corrigió y cerró.","Gustavo o la oficina, al cerrar el return."],
  ["Canceled","r","Cancelada antes de empezar.","La oficina. Solo se puede si está Scheduled o Confirmed."]
];

const MARKS={wo:[["tec","Técnico asignado"],["lleg","Llegada marcada"],["fotos","Fotos"],["val","Validada"],["sup","Supervisada"],["pago","Pago aprobado"],["fac","Factura aprobada"]],
             devolucion:[["dev","Return abierto"],["tu","Return fix creado"],["corr","Corregida"],["cerr","Cerrada"]]};
MARKS.validar=MARKS.wo; MARKS.imprevistos=[];

let fi=0, si=-1, timer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function drawFlows(){
  $("flows").innerHTML=FLOWS.map((f,i)=>`<button class="flow" aria-pressed="${i===fi}" data-i="${i}">${f.n}</button>`).join("")
    +`<button class="flow" aria-pressed="${fi===-1}" data-i="-1">Estados y personas</button>`;
}
$("flows").addEventListener("click",e=>{const b=e.target.closest(".flow"); if(!b) return; stop(); fi=+b.dataset.i; si=-1; drawFlows(); render(true);
  b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); window.scrollTo({top:0});});

function stateAt(f,i){ let s=f.start; for(let k=0;k<=i;k++) if(f.steps[k].to) s=f.steps[k].to; return s; }
function marksAt(f,i){ const m={}; for(let k=0;k<=i;k++) Object.assign(m,f.steps[k].marks||{}); return m; }
function msgsAt(f,i){ const out=[]; for(let k=0;k<=i;k++) (f.steps[k].msgs||[]).forEach(m=>out.push({...m,step:k})); return out.reverse(); }

function render(fresh){
  if(fi===-1){ renderMap(); $("bar").hidden=true; return; }
  $("bar").hidden=false;
  const f=FLOWS[fi], s=si>=0?f.steps[si]:null;
  const cur=stateAt(f,si), prev=si>0?stateAt(f,si-1):f.start, changed=si>=0&&cur[0]!==prev[0];
  const mk=marksAt(f,si), ml=MARKS[f.id]||[];
  const msgs=msgsAt(f,si);
  const p=s?PEOPLE[s.who]:null;
  $("main").innerHTML=`
    <div class="intro"><h2>${esc(f.n.replace(/^\d+ · /,""))}</h2><p>${esc(f.intro)}</p></div>
    <div class="steps" aria-label="Pasos">${f.steps.map((x,i)=>`<button class="dot ${i<si?"done":""} ${i===si?"cur":""}" data-i="${i}" aria-label="Paso ${i+1}: ${esc(x.t)}"></button>`).join("")}</div>
    <div class="grid">
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="obj" aria-live="polite">
          <div class="obj-h"><div><div class="obj-id">${esc(f.obj)}</div><div class="obj-sub">${esc(f.sub)}</div></div></div>
          <div class="trans">${changed?`<span class="st t-${prev[1]} old">${esc(prev[0])}</span><span class="arrow">→</span><span class="st t-${cur[1]} new">${esc(cur[0])}</span>`
                                     :`<span class="lab">Estado</span><span class="st t-${cur[1]}">${esc(cur[0])}</span>`}</div>
          ${ml.length?`<div class="marks">${ml.map(([k,n])=>`<span class="mark ${mk[k]?"on":""}">${mk[k]?"✓ ":""}${n}</span>`).join("")}</div>`:""}
        </div>
        ${s?`<div class="step">
          <div class="step-top"><div class="av" style="background:${p.c}">${ini(s.who)}</div>
            <div class="who"><b>${esc(s.who)}</b><span>${esc(p.r)}</span></div></div>
          <div class="lab">Paso ${si+1} de ${f.steps.length}</div>
          <h3>${esc(s.t)}</h3>
          <button class="btnsim ${fresh?"pressed":""}" tabindex="-1" aria-hidden="true">${esc(s.btn)}</button>
          <p>${esc(s.txt)}</p>
          ${s.why?`<div class="why"><b>Para qué sirve</b>${esc(s.why)}</div>`:""}
          ${s.rule?`<div class="rule">${s.rule}</div>`:""}
        </div>`:`<div class="step"><h3>Toca «Siguiente paso» para empezar</h3>
          <p>Vas a ver quién hace cada paso, qué botón toca, cómo cambia el estado y qué avisos o correos salen.</p>
          <p style="color:var(--soft)">También puedes tocar ▶ para que avance solo, o las barritas de arriba para saltar a un paso.</p></div>`}
      </div>
      <div class="inbox">
        <div class="inbox-h"><h3>Avisos y correos</h3><span class="cnt">${msgs.length} enviados</span></div>
        <div class="msgs">${msgs.length?msgs.map(m=>`<div class="msg ${m.step===si&&fresh?"fresh":""}">
            <div class="msg-h"><span class="kind k-${m.k}">${m.k==="mail"?"Correo":m.k==="alert"?"Alerta":"Aviso en la app"}</span><span class="to">Para: ${esc(m.to)}</span></div>
            <b class="sub">${esc(m.sub)}</b><span class="body">${esc(m.body)}</span></div>`).join("")
          :`<div class="empty">Aquí van a aparecer los correos y avisos que manda el sistema en cada paso.</div>`}</div>
      </div>
    </div>`;
  $("prev").disabled=si<0; $("next").disabled=si>=f.steps.length-1;
  $("next").textContent=si<0?"Empezar ›":si>=f.steps.length-1?"Fin del recorrido":"Siguiente paso ›";
  $("pos").textContent=si<0?`0/${f.steps.length}`:`${si+1}/${f.steps.length}`;
  $("play").textContent=timer?"❚❚":"▶";
}
$("main").addEventListener("click",e=>{
  const d=e.target.closest(".dot"); if(d){ stop(); si=+d.dataset.i; render(true); return; }
  const b=e.target.closest(".stb"); if(b){ selEstado=+b.dataset.i; renderMap(); }
});
$("next").onclick=()=>{ const f=FLOWS[fi]; if(si<f.steps.length-1){ si++; render(true); } };
$("prev").onclick=()=>{ stop(); if(si>=0){ si--; render(false); } };
$("play").onclick=()=>{ if(timer){ stop(); render(false); return; }
  const f=FLOWS[fi]; if(si>=f.steps.length-1) si=-1;
  timer=setInterval(()=>{ if(si<FLOWS[fi].steps.length-1){ si++; render(true); } else { stop(); render(false); } },3200);
  si++; render(true); };
function stop(){ if(timer){ clearInterval(timer); timer=null; } }

let selEstado=0;
function renderMap(){
  const e=ESTADOS[selEstado];
  const lane=ids=>ids.map((i,k)=>`${k?'<span class="arrow">→</span>':""}<button class="st t-${ESTADOS[i][1]} stb" data-i="${i}" aria-pressed="${i===selEstado}">${ESTADOS[i][0]}</button>`).join("");
  $("main").innerHTML=`
    <div class="intro"><h2>Estados de una Work Order</h2><p>Toca un estado para ver qué significa y quién lo cambia.</p></div>
    <div class="map">
      <div class="lab">Camino normal</div><div class="lane">${lane([0,1,3,7])}</div>
      <div class="lab">Si cambia la fecha</div><div class="lane">${lane([1,2,1])}</div>
      <div class="lab">Si algo frena el trabajo</div><div class="lane">${lane([3,4,3])} &nbsp; ${lane([3,5,6,3])}</div>
      <div class="lab">Si hay que corregir</div><div class="lane">${lane([7,8,9])}</div>
      <div class="lab">Si se cancela</div><div class="lane">${lane([0,10])}</div>
      <div class="stinfo" aria-live="polite"><b>${e[0]}</b> — ${e[2]}<br><span style="color:var(--soft)">Quién lo cambia: ${e[3]}</span></div>
      <p style="margin:0;color:var(--soft);font-size:14px">Facturada, pagada al técnico y cobrada no son estados: son marcas que se agregan a la WO cuando pasa cada cosa.</p>
    </div>
    <div class="intro"><h2>Quién hace qué</h2></div>
    <div class="people">${Object.entries(PEOPLE).map(([n,p])=>`<div class="person"><div class="av" style="background:${p.c}">${ini(n)}</div><div><b>${n}</b><span>${p.d}</span></div></div>`).join("")}</div>`;
}

document.addEventListener("keydown",e=>{ if(fi===-1) return; if(e.key==="ArrowRight") $("next").click(); if(e.key==="ArrowLeft") $("prev").click(); });
drawFlows(); render(false);
</script>
</body>
</html>
